apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: peernoise
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: peernoise
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: bittorrent-tcp
      port: {{ .Values.config.port }}
      targetPort: bittorrent-tcp
      protocol: TCP
    - name: bittorrent-udp
      port: {{ .Values.config.port }}
      targetPort: bittorrent-udp
      protocol: UDP
    - name: metrics
      port: {{ .Values.config.metrics.port }}
      targetPort: metrics
      protocol: TCP
