image:
  repository: ghcr.io/mixa3607/peernoise
  # Empty uses Chart.appVersion: latest locally, a pinned sha-... tag in CI packages.
  tag: ""
  pullPolicy: Always

imagePullSecrets: []

# Useful when the node's public IP/port should be the BitTorrent endpoint.
# Allow the configured TCP/UDP port in the node firewall/router as needed.
hostNetwork: false

# The published image currently supports amd64 only.
nodeSelector:
  kubernetes.io/arch: amd64

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

service:
  type: ClusterIP
  annotations: {}

# Rendered into a ConfigMap. Do not put credentials/passkeys here.
# Replacing this config triggers a pod restart on helm upgrade.
config:
  port: 6881
  metrics:
    # Must listen on the pod interface for Service access and HTTP probes.
    host: 0.0.0.0
    port: 9090
  refresh_minutes: 30
  count: 5
  feeds:
    - url: https://fosstorrents.com/feed/torrents.xml
    # Example for blocked feeds; the proxy must be reachable from the pod:
    # - url: https://feed.rutracker.cc/atom/f/0.atom
    #   proxy: http://192.168.1.200:2080
