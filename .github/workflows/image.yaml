name: Build and publish image and chart

on:
  push:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check and test
        run: |
          deno task check
          deno task test

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint and render chart
        run: |
          helm lint samples/chart --strict
          helm template peernoise samples/chart > /dev/null
          helm template peernoise samples/chart --set hostNetwork=true > /dev/null

      - name: Package chart
        id: chart
        run: |
          base_version=$(helm show chart samples/chart | awk '/^version:/ {print $2}')
          version="${base_version}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          image_tag="sha-${GITHUB_SHA::7}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p "$RUNNER_TEMP/chart-package"
          helm package samples/chart --version "$version" --app-version "$image_tag" \
            --destination "$RUNNER_TEMP/chart-package"
          package="$RUNNER_TEMP/chart-package/peernoise-${version}.tgz"
          # Both jobs must publish/use the same image repository, even in forks.
          helm template peernoise "$package" --set "image.repository=$image" > /dev/null
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo '### Helm OCI chart'
            echo "Chart version: \`$version\`; image: \`$image:$image_tag\`."
            echo '```sh'
            echo "helm upgrade --install peernoise oci://$registry/peernoise --version $version --set image.repository=$image --namespace peernoise --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push chart
        env:
          PACKAGE: ${{ steps.chart.outputs.package }}
          REGISTRY: ${{ steps.chart.outputs.registry }}
        run: helm push "$PACKAGE" "oci://$REGISTRY"
